<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CONSISTO — Build habits. Keep promises. Stay consistent.</title>
    <meta name="description" content="CONSISTO is a personal productivity and habit tracking PWA: recurring tasks, reminders, streaks, a GitHub-style consistency heatmap, analytics and notes." />
    <meta name="theme-color" content="#0b0a12" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Consisto" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto:wght@500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
    <script>
      // Apply the cached appearance before React mounts to avoid a theme flash.
      // (Firestore remains the source of truth; this is only a UI cache.)
      try {
        var ui = JSON.parse(localStorage.getItem('consisto-ui') || '{}');
        if (ui.theme) document.documentElement.setAttribute('data-theme', ui.theme);
        if (ui.accent) document.documentElement.style.setProperty('--accent', ui.accent);
        if (ui.accentStrong) document.documentElement.style.setProperty('--accent-strong', ui.accentStrong);
        if (ui.font) document.documentElement.style.setProperty('--app-font', ui.font);
      } catch (e) {}
      // Capture the install prompt as early as possible.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredPrompt = e;
        window.dispatchEvent(new Event('consisto:installable'));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
